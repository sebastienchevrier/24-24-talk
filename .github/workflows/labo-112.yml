# 24/24 ONE WORLD — Labo linguistique : les 112 langues, batterie courte des registres (MyMemory, gratuit).
# © 2026 Sébastien Chevrier. Tous droits réservés.
# Lancé à la main (onglet Actions) et chaque lundi à 05:00 UTC. Une langue par machine (quota MyMemory par adresse).
# Le rapport s'affiche dans le résumé du passage et l'historique est rangé sur la branche « labo-resultats »
# (jamais sur main). Aucun secret, aucune clé, ne touche ni à l'application, ni à la PROD, ni à Supabase.
name: Labo — 112 langues
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
concurrency:
  group: labo-112
  cancel-in-progress: false
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      langues: ${{ steps.l.outputs.langues }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: l
        run: echo "langues=$(node -e 'console.log(JSON.stringify(require("./labo/donnees/langues-112.js").langues.map(l=>l.code).filter(c=>c!=="fr")))')" >> "$GITHUB_OUTPUT"
  banc:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        langue: ${{ fromJSON(needs.liste.outputs.langues) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Banc réel vers ${{ matrix.langue }}
        run: node labo/tests/banc-112.js "${{ matrix.langue }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l112-${{ matrix.langue }}
          path: labo/tests/resultats/
          retention-days: 30
          if-no-files-found: ignore
  rapport:
    needs: banc
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: l112-*
          path: resultats-112
      - name: Rapport et comparaison avec le passage précédent
        run: |
          git fetch origin labo-resultats --depth=1 || true
          git show origin/labo-resultats:dernier-112.json > ancien.json 2>/dev/null || echo '{}' > ancien.json
          node labo/tests/rapport-112.js resultats-112 ancien.json > /dev/null
          cat resultats-112/rapport-112.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ranger l'historique sur la branche labo-resultats (jamais main)
        run: |
          D=$(date -u +%Y-%m-%d-%H%M)
          mkdir -p /tmp/h && cp resultats-112/dernier-112.json resultats-112/rapport-112.md /tmp/h/
          git config user.name "labo-one-world"; git config user.email "labo-one-world@users.noreply.github.com"
          if git rev-parse --verify origin/labo-resultats >/dev/null 2>&1; then git checkout -B labo-resultats origin/labo-resultats; else git checkout --orphan labo-resultats; git rm -rqf .; fi
          mkdir -p historique && cp /tmp/h/dernier-112.json "historique/112-$D.json" && cp /tmp/h/dernier-112.json /tmp/h/rapport-112.md .
          git add dernier-112.json rapport-112.md historique && git commit -qm "Labo 112 langues : passage du $D" && git push -q origin labo-resultats
