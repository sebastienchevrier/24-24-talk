<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
<title>Établissement · 24/24 ONE WORLD</title>

     Page du pilote B2B : établissement de cet appareil, lien de pilote à envoyer, bilan (chiffres seulement). -->
<style>
  :root { --bg: #07131d; --card: #0d1f2d; --txt: #e8f1f5; --muted: #9db3bf; --acc: #4fe0b0; --line: #1c3442; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 8px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 14px; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: .9rem; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #0a1923; color: var(--txt); font-size: 1rem; }
  button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; background: var(--acc); color: #05221a; font-weight: 700; font-size: 1rem; }
  button.sec { background: transparent; color: var(--txt); border: 1px solid var(--line); }
  .big { font-size: 2rem; font-weight: 800; color: var(--acc); }
  .muted { color: var(--muted); font-size: .9rem; }
  .lien { word-break: break-all; background: #0a1923; border-radius: 10px; padding: 10px; font-family: ui-monospace, monospace; font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  td, th { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  td:first-child, th:first-child { text-align: left; }
  a { color: var(--acc); }
</style>
</head>
<body>
<main>
  <p><a href="./" id="retour">← 24/24 ONE WORLD</a></p>
  <h1 id="titre">Établissement de cet appareil</h1>

  <section class="card" id="etat"></section>

  <section class="card" id="bilan"></section>

  <section class="card">
    <h2 id="h-lien">Créer un lien de pilote</h2>
    <p class="muted" id="t-lien">Le lien ouvre ONE WORLD au nom de l'établissement, avec son univers métier déjà choisi. Rien n'est créé sur un serveur.</p>
    <label for="nom" id="l-nom">Nom de l'établissement</label>
    <input id="nom" maxlength="80" autocomplete="off" placeholder="Hôtel du Port">
    <label for="ident" id="l-id">Identifiant (a-z, 0-9, tiret)</label>
    <input id="ident" maxlength="40" autocomplete="off" inputmode="url" placeholder="hotel-du-port">
    <label for="pack" id="l-pack">Univers métier</label>
    <select id="pack">
      <option value="luxury_hospitality">🛎️ Hôtellerie</option>
      <option value="logistics">🚚 Logistique</option>
      <option value="retail">🛍️ Commerce</option>
      <option value="">—</option>
    </select>
    <button id="creer">Créer le lien</button>
    <div id="sortie" hidden>
      <p class="lien" id="lien"></p>
      <button class="sec" id="copier">Copier le lien</button>
      <button class="sec" id="ici">Utiliser sur cet appareil</button>
    </div>
    <p class="muted" id="msg" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="etablissement.js"></script>
<script src="traduction/secours.js"></script>
